name: 'Terraform CI/CD Pipeline'

# Pipeline se déclenche à chaque modification du code (push)
on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: 'Terraform Validation & Plan'
    runs-on: ubuntu-latest

    # Faire en sorte que les commandes (run) s'exécutent dans le dossier voulu 
    defaults:
      run:
        working-directory: ./01-vpc


    steps:
      - name: 'Checkout du code'
        uses: actions/checkout@v4

      - name: 'Installation de Terraform'
        uses: hashicorp/setup-terraform@v3

      - name: 'Configuration AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: 'Terraform Format'
        run: terraform fmt -check

      - name: 'Terraform Init'
        run: terraform init

      - name: 'Terraform Validate'
        run: terraform validate

      - name: 'Terraform Plan'
        run: terraform plan

      - name: 'Terraform apply'
        # l'option permet le "yes" auto pour agir sur l'infra
        run: terraform apply -auto-approve
