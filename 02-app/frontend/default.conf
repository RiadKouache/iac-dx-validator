server {
    listen 80;

    # 1. Servir le Frontend (Vue.js)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 2. Le Reverse Proxy vers le Backend
    location /api/ {
        # L'IP sera injectée dynamiquement par Terraform plus tard !
        proxy_pass http://${backend_private_ip}:8000/;
    }
}
